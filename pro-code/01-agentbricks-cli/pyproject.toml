[project]
name = "agentbricks-cli-quickstart"
version = "0.1.0"
description = "Minimal LangGraph agent deployed with the Agent Bricks CLI"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks[langgraph]==0.6.0",
    "databricks-langchain==0.21.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[project.scripts]
start-server = "runtime.main:main"

[tool.ruff.lint.isort]
known-first-party = ["agent", "runtime", "scripts", "tests"]
