[project]
name = "loadtest-agentbricks-sample"
version = "0.1.0"
description = "A real inventory agent and a bounded Agent Bricks endpoint loadtest showcase"
requires-python = ">=3.11"
dependencies = [
  "databricks-openai==0.18.0",
  "databricks-sdk==0.159.0",
  "fastapi==0.162.0",
  "openai-agents==0.20.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.17.2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
