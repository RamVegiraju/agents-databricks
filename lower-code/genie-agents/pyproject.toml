[project]
name = "northstar-genie-assets"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["databricks-sdk==0.157.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "runtime", "scripts", "tests"]
